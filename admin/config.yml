backend:
  name: github
  repo: da-unch/kosogun
  branch: main
  base_url: https://sveltia-cms-auth.hoda-camel.workers.dev

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "河﨑"
    label: "河﨑帆高"
    folder: "河﨑"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime" }
      - { label: "レイアウト", name: "layout", widget: "hidden", default: "default" }
      - { label: "画像", name: "images", widget: "list", required: false, field: { label: "画像", name: "image", widget: "image" } }
      - { label: "リンク", name: "links", widget: "list", required: false, field: { label: "URL", name: "url", widget: "string" } }
      - { label: "本文", name: "body", widget: "markdown", required: false }

  - name: "堀井"
    label: "堀井映理"
    folder: "堀井"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime" }
      - { label: "レイアウト", name: "layout", widget: "hidden", default: "default" }
      - { label: "画像", name: "images", widget: "list", required: false, field: { label: "画像", name: "image", widget: "image" } }
      - { label: "リンク", name: "links", widget: "list", required: false, field: { label: "URL", name: "url", widget: "string" } }
      - { label: "本文", name: "body", widget: "markdown", required: false }

  - name: "中野"
    label: "中野築月"
    folder: "中野"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "日付", name: "date", widget: "datetime" }
      - { label: "レイアウト", name: "layout", widget: "hidden", default: "default" }
      - { label: "画像", name: "images", widget: "list", required: false, field: { label: "画像", name: "image", widget: "image" } }
      - { label: "リンク", name: "links", widget: "list", required: false, field: { label: "URL", name: "url", widget: "string" } }
      - { label: "本文", name: "body", widget: "markdown", required: false }

  - name: "order"
    label: "並び順"
    files:
      - name: "order"
        label: "タイルの並び順"
        file: "_data/order.yml"
        fields:
          - label: "並び順"
            name: "posts"
            widget: "list"
            required: false
            hint: "上から順にタイルに並びます。つまみをドラッグして並べ替え、Publishで保存。投稿の追加・削除は自動で反映されます（開いたままだと保存時に古いと言われるので、そのときは再読み込みしてから並べ替えてください）。"
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            collapsed: true
            summary: "{{fields.title}}"
            types:
              - label: "河﨑帆高"
                name: "河﨑"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - { label: "タイトル", name: "title", widget: "string", readonly: true, required: false }
                  - { label: "ファイル名", name: "post", widget: "string", readonly: true }
              - label: "堀井映理"
                name: "堀井"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - { label: "タイトル", name: "title", widget: "string", readonly: true, required: false }
                  - { label: "ファイル名", name: "post", widget: "string", readonly: true }
              - label: "中野築月"
                name: "中野"
                widget: "object"
                summary: "{{fields.title}}"
                fields:
                  - { label: "タイトル", name: "title", widget: "string", readonly: true, required: false }
                  - { label: "ファイル名", name: "post", widget: "string", readonly: true }
