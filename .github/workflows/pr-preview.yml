name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        if: github.event.action != 'closed'
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build
        if: github.event.action != 'closed'
        run: bundle exec jekyll build --baseurl "/kosogun/pr-preview/pr-${{ github.event.number }}"

      # The production deploy workflow also pushes to gh-pages; if both push at once, wait and retry.
      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          preview-branch: gh-pages

      - name: Wait before retrying preview
        if: steps.preview.outcome == 'failure'
        run: sleep 30

      - name: Deploy preview (retry)
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          preview-branch: gh-pages
