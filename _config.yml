title: 構想群 Kōsōgun
description: 額縁の共同リサーチ
markdown: kramdown

members:
  - key: K
  - key: H
  - key: N

defaults:
  - scope: { path: "K" }
    values: { layout: default }
  - scope: { path: "H" }
    values: { layout: default }
  - scope: { path: "N" }
    values: { layout: default }

# Internal notes stay in the repository but must not be published on the site.
exclude:
  - README.md
  - CLAUDE.md
  - AI掲示板.md
  - 議事録
  - Gemfile
  - Gemfile.lock
  - vendor
