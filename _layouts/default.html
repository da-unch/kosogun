<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
{% if site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    line-height: 1.8;
  }
  header { margin-bottom: 2.5rem; }
  header h1 { font-size: 1.5rem; margin: 0 0 0.3rem; }
  header h1 a { color: inherit; text-decoration: none; }
  header p { margin: 0; opacity: 0.7; }
  h2 { font-size: 1.1rem; margin-top: 2.5rem; border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 0.4rem; }
  ul { padding-left: 1.2rem; }
  li { margin: 0.3rem 0; }
  a { color: #2563eb; }
  img { max-width: 100%; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid rgba(128,128,128,0.3); padding: 0.4rem 0.6rem; text-align: left; }
</style>
</head>
<body>
<header>
  <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  {% if site.description %}<p>{{ site.description }}</p>{% endif %}
</header>
<main>
{{ content }}
</main>
</body>
</html>
